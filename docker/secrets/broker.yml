# Lives in the PRIVATE secrets repo (copy of docker/secrets/broker.yml of the project). Only collaborators of that repo
# can start it. It encrypts the repo/environment secrets to the one-time public key of the requester and uploads the
# bundle as a one-day artifact (visible only to people who can see this repo). It never prints a secret.
name: broker
run-name: broker ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "random id of the request (hex)"
        required: true
      pubkey:
        description: "base64 of the one-time RSA public key (PEM)"
        required: true
permissions:
  contents: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    environment: broker
    timeout-minutes: 5
    steps:
      - name: Encrypt the secrets to the requester's one-time key
        env:
          VERDA_CLIENT_ID: ${{ secrets.VERDA_CLIENT_ID }}
          VERDA_CLIENT_SECRET: ${{ secrets.VERDA_CLIENT_SECRET }}
          YESOPEN_GPU_SSH_KEY: ${{ secrets.YESOPEN_GPU_SSH_KEY }}
          YESOPEN_GPU_SSH_KEY_PUB: ${{ secrets.YESOPEN_GPU_SSH_KEY_PUB }}
          PUBKEY: ${{ inputs.pubkey }}
          REQ: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$REQ" =~ ^[a-f0-9]{16,64}$ ]]
          umask 077
          mkdir out
          printf '%s' "$PUBKEY" | base64 -d > pub.pem
          for n in VERDA_CLIENT_ID VERDA_CLIENT_SECRET YESOPEN_GPU_SSH_KEY YESOPEN_GPU_SSH_KEY_PUB; do
            [ -n "${!n}" ] && printf '%s=%s\n' "$n" "$(printf '%s' "${!n}" | base64 -w0)"
          done > plain
          openssl rand -hex 32 > pass
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:pass -in plain -out out/data.enc
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in pass -out out/pass.enc
          rm -f plain pass
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ inputs.request_id }}
          path: out
          retention-days: 1
