# Browser preview on a small CPU VM; never requests an NVIDIA device.
# docker compose -f compose.yaml -f compose.cpu.yaml up -d comfyui editor-api
services:
  comfyui:
    command: ["python", "main.py", "--cpu", "--listen", "0.0.0.0", "--port", "8188", "--disable-auto-launch"]
    shm_size: 1gb
    deploy: !reset {}
